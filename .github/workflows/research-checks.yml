name: Intraday research integrity

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'trading_agent/execution.py'
      - 'trading_agent/risk.py'
      - 'requirements-research.txt'
      - 'scripts/check_research.py'
      - 'artifacts/intraday/**/preregistration.json'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Check accounting and causal execution
        env:
          NUMBA_NUM_THREADS: '4'
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_research.py
          python -m research.intraday_mean_reversion.session_study self-check
          python -m research.intraday_mean_reversion.session_study book-self-check
